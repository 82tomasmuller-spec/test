<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSV Product Translator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>CSV Product Translator</h1>
            <p class="subtitle">Nahrajte CSV soubor s nazvy produktu v cestine &mdash; automaticky je prelozime do anglictiny, nemciny a slovenstiny.</p>
        </header>

        <section class="upload-section" id="uploadSection">
            <div class="drop-zone" id="dropZone">
                <div class="drop-zone-icon">&#128196;</div>
                <p>Pretahnete CSV soubor sem</p>
                <p class="drop-zone-hint">nebo</p>
                <label class="btn btn-primary" for="fileInput">Vybrat soubor</label>
                <input type="file" id="fileInput" accept=".csv" hidden>
            </div>
        </section>

        <section class="settings-section" id="settingsSection" hidden>
            <h2>Nastaveni</h2>
            <div class="settings-row">
                <div class="setting">
                    <label for="columnSelect">Sloupec s ceskymi nazvy:</label>
                    <select id="columnSelect"></select>
                </div>
                <div class="setting">
                    <label for="delimiterSelect">Oddelovac:</label>
                    <select id="delimiterSelect">
                        <option value="," selected>Carka (,)</option>
                        <option value=";">Strednik (;)</option>
                        <option value="\t">Tabulator</option>
                    </select>
                </div>
            </div>
            <button class="btn btn-primary" id="translateBtn">Prelozit</button>
        </section>

        <section class="progress-section" id="progressSection" hidden>
            <h2>Probiha preklad...</h2>
            <div class="progress-bar-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <p class="progress-text" id="progressText">0 / 0</p>
        </section>

        <section class="preview-section" id="previewSection" hidden>
            <h2>Nahled vysledku</h2>
            <div class="table-wrapper">
                <table id="previewTable">
                    <thead id="previewHead"></thead>
                    <tbody id="previewBody"></tbody>
                </table>
            </div>
            <div class="export-row">
                <button class="btn btn-success" id="exportBtn">Stahnout CSV</button>
                <button class="btn btn-secondary" id="resetBtn">Nahrat dalsi soubor</button>
            </div>
        </section>

        <div class="error-message" id="errorMessage" hidden></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
